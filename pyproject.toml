[project]
name = "21-multimodal-tutor-agent"
version = "0.1.0"
description = "Multimodal learning assistance with OpenAI and LangSmith"
readme = "README.md"
authors = [
    { name = "vipinyadavgit", email = "vipinyadav.git@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "streamlit",
    "openai",
    "langsmith",
    "pillow",
    "pdf2image",
    "pytesseract",
    "python-dotenv>=1.2.4",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false

[tool.uv.build-backend]
module-name = "multimodal_tutor_agent"
